version: "3.8"
services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - .env


  db:
    image: postgres:15
    environment:
      POSTGRES_DB: beeapi
      POSTGRES_USER: beeuser
      POSTGRES_PASSWORD: beepass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
